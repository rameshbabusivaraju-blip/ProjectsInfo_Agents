[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
 
# Neither ships type stubs (faiss is a SWIG-wrapped C++ library; sentence-transformers'
# own stubs are incomplete as of this pin) -- AGENTS-37.
[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true